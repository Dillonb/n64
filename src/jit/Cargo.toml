[package]
name = "jit"
version = "0.1.0"
edition = "2021"

[features]
default = []
ir_comments = ["dgbir/ir_comments"]

[lib]
crate-type = ["staticlib"]

[dependencies]
proc-bitfield = "0.5.0"
itertools = "0.13.0"
dgbir = { path = "./dgbir" }
log = "0.4.28"
env_logger = "0.11.8"

[build-dependencies]
bindgen = "0.71.1"
